name: SSXIs Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Geode
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Win64
